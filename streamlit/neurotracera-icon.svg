<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background glow filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.13
        0 0 0 0 0.74
        0 0 0 0 0.97
        0 0 0 0.6 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Brain outline gradient -->
    <linearGradient id="brainStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Brain gyri inner glow -->
    <linearGradient id="gyriGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Scanning C arc gradient -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Heatmap Radial Gradient: Blue -> Cyan -> Yellow -> Orange -> Red -->
    <radialGradient id="heatmapGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1e27" />       <!-- Intense Red Hot-Spot -->
      <stop offset="22%" stop-color="#ff5e00" />      <!-- Radiant Orange -->
      <stop offset="42%" stop-color="#ffbe00" />      <!-- Golden Amber -->
      <stop offset="58%" stop-color="#00e5ff" />      <!-- Luminous Cyan -->
      <stop offset="78%" stop-color="#0066ff" />      <!-- Royal Blue -->
      <stop offset="94%" stop-color="#031b4e" />      <!-- Deep Navy Outer Ring -->
      <stop offset="100%" stop-color="#020e2b" />     <!-- Fade edge -->
    </radialGradient>
  </defs>

  <!-- Ground reflection / subtle ambient flare -->
  <ellipse cx="256" cy="485" rx="140" ry="12" fill="#0284c7" opacity="0.28" filter="blur(10px)" />

  <g transform="translate(10, 0)">
    <!-- LEFT SIDE: Stylized Brain Hemisphere -->
    <!-- Outer brain contour -->
    <path d="M 235 90 
             C 215 90, 195 95, 180 106 
             C 162 100, 142 106, 130 120 
             C 112 122, 98 138, 96 156 
             C 80 168, 72 190, 76 210 
             C 66 226, 68 248, 78 264 
             C 72 284, 80 306, 96 320 
             C 94 338, 106 356, 124 364 
             C 136 382, 158 394, 180 394 
             C 198 408, 220 410, 235 408 
             L 235 90 Z" 
          fill="#051633" 
          stroke="url(#brainStrokeGrad)" 
          stroke-width="12" 
          stroke-linejoin="round"
          stroke-linecap="round"
          filter="url(#neonGlow)" />

    <!-- Inner sulci / gyri neural convolutions -->
    <!-- Frontal lobe gyri -->
    <path d="M 215 130 C 185 132, 160 155, 185 178 C 205 196, 215 185, 215 185" 
          stroke="url(#gyriGrad)" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.9" />
    <!-- Parietal lobe gyri -->
    <path d="M 155 175 C 130 190, 125 220, 150 240 C 170 255, 195 240, 205 255 C 215 270, 195 285, 175 285" 
          stroke="url(#gyriGrad)" stroke-width="8.5" stroke-linecap="round" fill="none" opacity="0.9" />
    <!-- Temporal/Occipital gyri -->
    <path d="M 130 260 C 105 280, 115 315, 140 325 C 165 335, 185 320, 195 340 C 205 360, 180 375, 160 375" 
          stroke="url(#gyriGrad)" stroke-width="8.5" stroke-linecap="round" fill="none" opacity="0.9" />
    <!-- Lower cerebellum convolution -->
    <path d="M 215 320 C 200 320, 190 330, 205 345 C 220 360, 215 380, 215 385" 
          stroke="url(#gyriGrad)" stroke-width="7.5" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- Neural connection glowing nodes -->
    <circle cx="160" cy="155" r="4.5" fill="#ffffff" filter="drop-shadow(0 0 6px #38bdf8)" />
    <circle cx="195" cy="225" r="5" fill="#ffffff" filter="drop-shadow(0 0 6px #38bdf8)" />
    <circle cx="145" cy="295" r="4.5" fill="#ffffff" filter="drop-shadow(0 0 6px #38bdf8)" />
    <circle cx="215" cy="270" r="4" fill="#ffffff" filter="drop-shadow(0 0 6px #38bdf8)" />


    <!-- RIGHT SIDE: C-Shaped Scanning Arc & Heatmap Target -->
    <!-- Scanning C Outer Arc -->
    <!-- Top arm -->
    <path d="M 260 88 
             C 330 88, 395 125, 435 180 
             L 395 208 
             C 365 168, 315 140, 260 140 
             Z" 
          fill="url(#arcGrad)" 
          filter="url(#neonGlow)" />

    <!-- Bottom arm -->
    <path d="M 260 410 
             C 330 410, 395 373, 435 318 
             L 395 290 
             C 365 330, 315 358, 260 358 
             Z" 
          fill="url(#arcGrad)" 
          filter="url(#neonGlow)" />

    <!-- Circular Medical Imaging Heatmap Target -->
    <g transform="translate(325, 249)">
      <!-- Outer target ring container -->
      <circle cx="0" cy="0" r="88" fill="url(#heatmapGrad)" stroke="#0ea5e9" stroke-width="2.5" filter="url(#softGlow)" />

      <!-- Concentric range calibration rings -->
      <circle cx="0" cy="0" r="66" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" />
      <circle cx="0" cy="0" r="44" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" />
      <circle cx="0" cy="0" r="22" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" />

      <!-- Surgical Precision Crosshairs -->
      <!-- Horizontal line extending beyond target -->
      <line x1="-106" y1="0" x2="106" y2="0" stroke="#ffffff" stroke-width="2.2" opacity="0.95" filter="drop-shadow(0 0 4px #38bdf8)" />
      <!-- Vertical line extending beyond target -->
      <line x1="0" y1="-106" x2="0" y2="106" stroke="#ffffff" stroke-width="2.2" opacity="0.95" filter="drop-shadow(0 0 4px #38bdf8)" />

      <!-- Center Hot-spot crosshair reticle -->
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>
  </g>
</svg>