<script>
(function() {
  function triggerAuthRedirect(action) {
    var act = (action === 'analysis') ? 'analysis' : 'login';
    var search = (act === 'analysis') ? '?auth=1&action=analysis' : '?auth=1';

    // 1. Post message to parent / top window
    try {
      if (window.parent) {
        window.parent.postMessage({ type: 'NEUROTRACERA_NAVIGATE', action: act }, '*');
      }
      if (window.top && window.top !== window.parent) {
        window.top.postMessage({ type: 'NEUROTRACERA_NAVIGATE', action: act }, '*');
      }
    } catch (e) {}

    // 2. Direct top navigation attempt
    try {
      if (window.top && window.top !== window.self) {
        window.top.location.href = window.top.location.origin + window.top.location.pathname + search;
        return;
      }
    } catch (err) {}

    // 3. Try window.open targeting _top
    try {
      window.open(window.location.origin + window.location.pathname + search, '_top');
      return;
    } catch (err) {}

    // 4. Only navigate self if NOT in an iframe
    if (window.top === window.self) {
      window.location.href = window.location.origin + window.location.pathname + search;
    }
  }

  // Delegated event listener for all CTA actions
  document.addEventListener('click', function(e) {
    var target = e.target.closest('button, a');
    if (!target) return;
    
    // Ignore internal anchor hashes like #platform, #workflow, etc.
    var href = target.getAttribute('href');
    if (href && href.startsWith('#')) return;
    
    var text = (target.textContent || '').trim().toLowerCase();
    if (
      text.includes('start analysis') ||
      text.includes('launch mri workspace') ||
      text.includes('start new analysis')
    ) {
      e.preventDefault();
      e.stopPropagation();
      triggerAuthRedirect('analysis');
    } else if (
      text.includes('sign in') ||
      text.includes('portal sign in') ||
      text.includes('create account')
    ) {
      e.preventDefault();
      e.stopPropagation();
      triggerAuthRedirect('login');
    }
  }, true);

  // Height reporting for auto-sizing iframes
  function reportHeight() {
    var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
    window.parent.postMessage({
      type: "streamlit:setFrameHeight",
      height: h
    }, "*");
  }
  window.addEventListener('load', reportHeight);
  window.addEventListener('resize', reportHeight);
  setTimeout(reportHeight, 300);
  setTimeout(reportHeight, 1000);
  setTimeout(reportHeight, 2500);
})();
</script>
