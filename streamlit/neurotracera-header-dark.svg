<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="hdrWordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#22d3ee" />
      <stop offset="70%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <linearGradient id="hdrArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <radialGradient id="hdrHeatmap" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1e27" />
      <stop offset="22%" stop-color="#ff5e00" />
      <stop offset="44%" stop-color="#ffbe00" />
      <stop offset="60%" stop-color="#00e5ff" />
      <stop offset="80%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#020e2b" />
    </radialGradient>

    <filter id="hdrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ICON (Scaled and placed at x=10, y=10) -->
  <g transform="translate(10, 10) scale(0.195)">
    <!-- Brain outline -->
    <path d="M 235 90 C 215 90, 195 95, 180 106 C 162 100, 142 106, 130 120 C 112 122, 98 138, 96 156 C 80 168, 72 190, 76 210 C 66 226, 68 248, 78 264 C 72 284, 80 306, 96 320 C 94 338, 106 356, 124 364 C 136 382, 158 394, 180 394 C 198 408, 220 410, 235 408 L 235 90 Z" 
          fill="#051633" stroke="url(#hdrArcGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Gyri -->
    <path d="M 215 130 C 185 132, 160 155, 185 178 C 205 196, 215 185, 215 185" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M 155 175 C 130 190, 125 220, 150 240 C 170 255, 195 240, 205 255 C 215 270, 195 285, 175 285" stroke="#38bdf8" stroke-width="8.5" stroke-linecap="round" fill="none" />
    <path d="M 130 260 C 105 280, 115 315, 140 325 C 165 335, 185 320, 195 340 C 205 360, 180 375, 160 375" stroke="#38bdf8" stroke-width="8.5" stroke-linecap="round" fill="none" />
    
    <!-- Scanning C -->
    <path d="M 260 88 C 330 88, 395 125, 435 180 L 395 208 C 365 168, 315 140, 260 140 Z" fill="url(#hdrArcGrad)" />
    <path d="M 260 410 C 330 410, 395 373, 435 318 L 395 290 C 365 330, 315 358, 260 358 Z" fill="url(#hdrArcGrad)" />

    <!-- Heatmap Target -->
    <g transform="translate(325, 249)">
      <circle cx="0" cy="0" r="88" fill="url(#hdrHeatmap)" stroke="#0ea5e9" stroke-width="3" />
      <circle cx="0" cy="0" r="58" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
      <line x1="-106" y1="0" x2="106" y2="0" stroke="#ffffff" stroke-width="2.5" />
      <line x1="0" y1="-106" x2="0" y2="106" stroke="#ffffff" stroke-width="2.5" />
      <circle cx="0" cy="0" r="4" fill="#ffffff" />
    </g>
  </g>

  <!-- TYPOGRAPHIC WORDMARK: NeuroTraCera -->
  <g transform="translate(130, 78)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="64" letter-spacing="-1.5">
    <!-- 'Neuro' in Clean Pure White with subtle glow -->
    <text x="0" y="0" fill="#ffffff" filter="url(#hdrGlow)">Neuro</text>
    
    <!-- 'Tra' in Cyan-to-Blue Gradient -->
    <text x="186" y="0" fill="url(#hdrWordGrad)" filter="url(#hdrGlow)">Tra</text>
    
    <!-- Stylized 'C' with dual sensor aperture dots -->
    <g transform="translate(296, 0)">
      <text x="0" y="0" fill="url(#hdrWordGrad)" filter="url(#hdrGlow)">C</text>
      <!-- Dual sensor dots inside 'C' -->
      <circle cx="23" cy="-21" r="5.5" fill="#38bdf8" filter="drop-shadow(0 0 3px #ffffff)" />
      <circle cx="34" cy="-28" r="3.2" fill="#67e8f9" filter="drop-shadow(0 0 2px #ffffff)" />
    </g>

    <!-- 'era' in Cyan-to-Blue Gradient -->
    <text x="348" y="0" fill="url(#hdrWordGrad)" filter="url(#hdrGlow)">era</text>
  </g>
</svg>